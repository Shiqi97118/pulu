<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src blob: data:; img-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>PULU</title><link rel="stylesheet" href="style.css"></head><body><main id="controls" hidden><header><span class="eyebrow">PULU · MAKE PULU ALIVE</span><h1>小家伙，在这里。</h1><p>银灰虎斑角色设计迭代 · V0.2 Study</p></header><p id="status" role="status"></p><p id="notice" role="alert"></p><div class="buttons"><button data-action="pet">摸摸</button><button data-action="pause">暂停 / 继续</button><button data-action="reduce">减少动态</button><button data-action="lowPower">低功耗模式</button><button data-action="quiet">安静陪伴</button><button data-action="hide">隐藏 / 演示模式</button><button data-action="show">显示 / 找回</button><button data-action="quit">退出 PULU</button></div><section><h2>它记得什么</h2><p class="hint">只保存你确认的称呼与偏好，以及近14天的抚摸次数。全部留在本机。</p><form id="nameForm"><label for="petName">给小猫的称呼</label><div class="inputRow"><input id="petName" maxlength="24" placeholder="扑噜" autocomplete="off"><button type="submit">确认保存</button></div></form><ul id="memories"></ul><p id="summary"></p><div class="buttons"><button data-action="export">导出本地资料</button><button id="clear">清空记忆</button></div><div id="confirmClear" hidden><p>将删除称呼、偏好和互动次数，保留显示设置。确定清空吗？</p><button id="confirmDelete">确定清空</button><button id="cancelDelete">取消</button></div></section><footer>角色仍待视觉签收。无云端 AI、语义记忆、账号、声音或自动启动。全屏避让暂用手动演示模式。</footer></main><p id="error" hidden role="alert">3D 渲染暂不可用，请从菜单栏打开控制面板。<button id="retry">重新加载角色</button></p><script type="module" src="app.js"></script></body></html>
